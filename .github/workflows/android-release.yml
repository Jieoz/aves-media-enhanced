name: Android release APK
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Use repository-pinned Flutter SDK
        run: |
          set -euo pipefail
          test -x "$GITHUB_WORKSPACE/.flutter/bin/flutter"
          # actions/checkout fetches submodules at depth 1 without tags. Flutter
          # then identifies this exact tagged revision as 0.0.0-unknown, which
          # makes pub reject this repository's minimum SDK constraint.
          git -C "$GITHUB_WORKSPACE/.flutter" fetch --force --depth=1 origin tag 3.47.0-0.3.pre
          test "$(git -C "$GITHUB_WORKSPACE/.flutter" describe --tags --exact-match HEAD)" = '3.47.0-0.3.pre'
          echo "$GITHUB_WORKSPACE/.flutter/bin" >> "$GITHUB_PATH"
          if ! "$GITHUB_WORKSPACE/.flutter/bin/flutter" --version; then
            # Some archive/filesystem combinations lose executable bits.
            python3 scripts/repair_flutter_cache_permissions.py "$GITHUB_WORKSPACE/.flutter"
            "$GITHUB_WORKSPACE/.flutter/bin/flutter" --version
          fi
          test "$("$GITHUB_WORKSPACE/.flutter/bin/flutter" --version --machine | python3 -c 'import json,sys; print(json.load(sys.stdin)["frameworkVersion"] )')" = '3.47.0-0.3.pre'
          "$GITHUB_WORKSPACE/.flutter/bin/flutter" config --no-analytics
          "$GITHUB_WORKSPACE/.flutter/bin/flutter" precache --android --linux
          python3 scripts/repair_flutter_cache_permissions.py "$GITHUB_WORKSPACE/.flutter"
      - name: Read application version
        shell: bash
        run: |
          set -euo pipefail
          version_value="$(awk '/^version:/ {print $2; exit}' pubspec.yaml)"
          test -n "$version_value"
          echo "APP_VERSION=${version_value%%+*}" >> "$GITHUB_ENV"
          echo "APP_VERSION_CODE=${version_value##*+}" >> "$GITHUB_ENV"
      - name: Flutter pub get
        run: flutter pub get
      - name: Flutter analyze
        run: flutter analyze
      - name: Flutter tests
        run: flutter test
      - name: Media reconciliation source contracts
        run: python3 scripts/test_media_reconciliation_contract.py
      - name: Configure libre flavor
        run: |
          sed -i 's|plugins/aves_services_.*|plugins/aves_services_none|g' pubspec.yaml
          sed -i 's|plugins/aves_report_.*|plugins/aves_report_console|g' pubspec.yaml
          flutter pub get
      - name: Android unit tests
        working-directory: android
        run: |
          test -f ../lib/main_libre.dart
          ./gradlew testLibreDebugUnitTest -Ptarget=lib/main_libre.dart --stacktrace --no-daemon
      - name: Decode release keystore
        if: github.event_name != 'pull_request'
        env:
          AVES_KEYSTORE_BASE64: ${{ secrets.AVES_KEYSTORE_BASE64 }}
        run: |
          test -n "$AVES_KEYSTORE_BASE64"
          printf '%s' "$AVES_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/aves-media-enhanced.jks"
          test -s "$RUNNER_TEMP/aves-media-enhanced.jks"
      - name: Build signed split release APKs
        if: github.event_name != 'pull_request'
        env:
          AVES_STORE_FILE: ${{ runner.temp }}/aves-media-enhanced.jks
          AVES_STORE_PASSWORD: ${{ secrets.AVES_STORE_PASSWORD }}
          AVES_KEY_ALIAS: ${{ secrets.AVES_KEY_ALIAS }}
          AVES_KEY_PASSWORD: ${{ secrets.AVES_KEY_PASSWORD }}
          AVES_GOOGLE_API_KEY: NONE
        run: flutter build apk --release -t lib/main_libre.dart --flavor libre --split-per-abi
      - name: Verify release APKs
        if: github.event_name != 'pull_request'
        id: verify_apks
        run: |
          set -euo pipefail
          shopt -s nullglob
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [[ -z "${SDK_ROOT}" ]]; then
            for d in "$HOME/Android/Sdk" /usr/local/lib/android/sdk /opt/android-sdk; do
              if [[ -d "$d/build-tools" ]]; then
                SDK_ROOT="$d"
                break
              fi
            done
          fi
          test -n "${SDK_ROOT}"
          test -d "${SDK_ROOT}/build-tools"
          # Prefer a known-good build-tools pair. Latest (37.x) wrappers have
          # silently failed this step with no stdout after the path print.
          pick_tool() {
            local name="$1"
            local chosen=""
            local d
            for d in 35.0.0 34.0.0 33.0.3; do
              if [[ -x "${SDK_ROOT}/build-tools/${d}/${name}" ]]; then
                chosen="${SDK_ROOT}/build-tools/${d}/${name}"
                break
              fi
            done
            if [[ -z "$chosen" ]]; then
              chosen="$(find "${SDK_ROOT}/build-tools" -type f -name "$name" | sort -V | tail -1)"
            fi
            printf '%s' "$chosen"
          }
          APKSIGNER="$(pick_tool apksigner)"
          AAPT2="$(pick_tool aapt2)"
          test -x "$APKSIGNER"
          test -x "$AAPT2"
          printf 'verify tools SDK_ROOT=%s APKSIGNER=%s AAPT2=%s\n' "$SDK_ROOT" "$APKSIGNER" "$AAPT2"
          apks=(build/app/outputs/apk/libre/release/*.apk)
          test "${#apks[@]}" -eq 3
          mkdir -p release-apks
          seen_abis=()
          for apk in "${apks[@]}"; do
            echo "verifying $(basename "$apk")"
            "$APKSIGNER" verify --print-certs "$apk" > signer.txt 2> signer.err || {
              echo "apksigner failed for $apk"
              cat signer.txt signer.err
              exit 1
            }
            signer_digest="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' signer.txt | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]' | head -1)"
            printf 'signer_digest=%s\n' "$signer_digest"
            test -n "$signer_digest"
            test "$signer_digest" = 'db3ab984c43e7468588150c2a0d9886c3701992a76a6326d7b510bbabd89866f'
            badging="$("$AAPT2" dump badging "$apk")"
            grep -q "package: name='io.github.jieoz.avesmediaenhanced.libre'" <<<"$badging" || {
              echo "package name mismatch for $apk"
              echo "$badging" | head
              exit 1
            }
            grep -q "versionName='$APP_VERSION'" <<<"$badging" || {
              echo "versionName mismatch for $apk"
              echo "$badging" | head
              exit 1
            }
            abi="$(sed -n "s/.*native-code: '\([^']*\)'.*/\1/p" <<<"$badging" | awk 'NF{print; exit}')"
            case "$abi" in
              armeabi-v7a) expected_code="$((APP_VERSION_CODE * 100 + 1))" ;;
              arm64-v8a) expected_code="$((APP_VERSION_CODE * 100 + 2))" ;;
              x86_64) expected_code="$((APP_VERSION_CODE * 100 + 4))" ;;
              *) echo "unexpected ABI: [$abi]"; echo "$badging" | grep native-code; exit 1 ;;
            esac
            grep -q "versionCode='$expected_code'" <<<"$badging"
            unzip -Z1 "$apk" > apk-entries.txt
            grep -q "^lib/$abi/" apk-entries.txt
            if grep '^lib/' apk-entries.txt | grep -Evq "^lib/$abi/"; then
              echo "APK contains native libraries from another ABI: $apk"
              exit 1
            fi
            seen_abis+=("$abi")
            unzip -t "$apk" >/dev/null
            cp "$apk" "release-apks/aves-media-enhanced-$APP_VERSION-$abi.apk"
          done
          test "$(printf '%s\n' "${seen_abis[@]}" | sort -u | wc -l)" -eq 3
          (cd release-apks && sha256sum *.apk > SHA256SUMS.txt)
      - name: Remove decoded keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/aves-media-enhanced.jks"
      - name: Upload raw APKs for failed verification
        if: github.event_name != 'pull_request' && failure() && steps.verify_apks.conclusion == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: aves-media-enhanced-verification-failure
          path: build/app/outputs/apk/libre/release/*.apk
          if-no-files-found: error
      - name: Upload signed release APKs
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: aves-media-enhanced-release
          path: release-apks/*
          if-no-files-found: error
